<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246b55"><link rel="manifest" href="manifest.webmanifest"><title>Carga de baterías</title><style>body{font:16px system-ui;background:#f1f5f2;color:#17392b;margin:0}header{background:#246b55;color:white;padding:18px}h1{font-size:23px;margin:0}main{padding:15px;max-width:720px;margin:auto}button{border:0;border-radius:12px;padding:12px;background:#d9eae0;color:#174734;font:inherit;margin:3px}button.primary{background:#246b55;color:white}.card,form{background:white;padding:17px;border-radius:16px;margin:12px 0;box-shadow:0 2px 8px #0001}label{display:block;margin:12px 0 4px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aac5b7;border-radius:8px;font:inherit}textarea{min-height:70px}.fab{position:fixed;bottom:20px;right:20px;border-radius:50%;font-size:30px;width:65px;height:65px}.overlay{position:fixed;inset:0;background:#0009;overflow:auto;padding:10px;display:none}.overlay.show{display:block}.overlay form{max-width:550px;margin:15px auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:450px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>Carga de baterías</h1>Cuaderno de carga</header><main><button onclick="exportXML()">Exportar XML</button><button onclick="document.getElementById('file').click()">Importar XML</button><input hidden type="file" id="file" accept=".xml,text/xml" onchange="importXML(event)"><div id="cards"></div><footer style="text-align:center;font-size:11px;color:#64776d;padding:12px 15px 90px">Luis T Escolar<br><a href="https://www.youtube.com/BitsChips" target="_blank" rel="noopener noreferrer" style="color:inherit">Canal de YouTube: Bits Chips</a><br>Carga de baterías · Versión 1.1.1</footer></main><button class="fab primary" onclick="edit()">+</button><div class="overlay" id="overlay"><form id="form"><h2>Ficha del experimento</h2><div class="row"><div><label>Tipo de pila</label><select id="tipo"><option>NiMH</option><option>NiCd</option><option>Li-ion</option><option>LiFePO4</option><option>Plomo</option><option>Otra</option></select></div><div><label>Formato de pila</label><select id="formato"><option value="">Sin especificar</option><option>AAA</option><option>AA</option><option>A</option><option>Sub-C</option><option>C</option><option>D</option><option>9 V (PP3)</option><option>18650</option><option>21700</option><option>26650</option><option>CR2032</option><option>Prismática</option><option>Bolsa (pouch)</option><option>Otro</option></select></div><div><label>Capacidad (mAh)</label><input id="capacidad" type="number" step="any"></div><div><label>Identificación de batería</label><input id="notasBateria" type="text" placeholder="Ej.: taladro antiguo, MediaMarkt"></div><div><label>Tensión inicial (V)</label><input id="vinicial" type="number" step="any"></div><div><label>Tensión de carga (V)</label><input id="vcarga" type="number" step="any"></div><div><label>Intensidad de carga (mA)</label><input id="corriente" type="number" step="any"></div><div><label>Inicio</label><input id="inicio" type="datetime-local" required></div><div><label>Fin</label><input id="fin" type="datetime-local"></div><div><label>Tensión final (V)</label><input id="vfinal" type="number" step="any"></div></div><label>Observaciones</label><textarea id="observaciones"></textarea><p><button class="primary" type="submit">Guardar</button><button type="button" onclick="closeForm()">Cancelar</button></p></form></div><script src="app.js?v=7"></script></body></html>
